# Alternativa à Vercel. Na Netlify, defina "Base directory" como frontend/.

[build]
  command = "npm run build"
  publish = "dist"

# SPA: /todo-list e /finance-tracker são rotas do React Router, não arquivos.
# Sem este redirect, recarregar a página nelas devolve 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
