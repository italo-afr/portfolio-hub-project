<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ítalo Freire">
  <!--
    Monograma "íf", o mesmo da navbar.

    As letras são paths, não <text>: favicon renderizado com fonte do sistema
    varia de máquina para máquina e some em alguns contextos.

    O fundo é sólido (e não o verde a 10% usado na navbar) porque o ícone
    aparece sobre abas claras e escuras — sem fundo próprio ele sumiria.
  -->
  <rect width="64" height="64" rx="14" fill="#08090b" />
  <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="12.6"
        fill="none" stroke="#22c98a" stroke-opacity="0.28" stroke-width="3" />

  <g stroke="#4ade9b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- í -->
    <path d="M22.5 27V46" stroke-width="6.5" />
    <path d="M20 21.5 25.5 16" stroke-width="5" />

    <!-- f -->
    <path d="M44.5 17c-5-3-8.5-.5-8.5 6v23" stroke-width="6.5" />
    <path d="M29.5 30.5h15" stroke-width="5.5" />
  </g>
</svg>
